name: Build iOS app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target SupportPatch
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-simulator/Build/Products/Debug-iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Build for iOS Device (unsigned IPA)
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target SupportPatch
          -sdk iphoneos
          -configuration Release
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-device/Build/Products/Release-iphoneos
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/SupportPatch.app Payload/
          zip -qr SupportPatch-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SupportPatch-ios-simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SupportPatch-unsigned-ipa
          path: SupportPatch-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
